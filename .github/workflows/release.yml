name: Publish verified beta

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'GregoryTelegin/anchor-recall-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify frozen bytes and release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/verify-release.py "$RELEASE_TAG"
      - name: Verify JavaScript syntax
        run: node --check main.js
      - name: Publish beta assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease
          --title "Anchor Recall $RELEASE_TAG — beta"
          --notes-file release-notes.md
          main.js manifest.json styles.css LICENSE THIRD_PARTY_NOTICES.md
          TESTER-ru.md BUILD.json SHA256SUMS.txt AnchorRecall-0.1.0.zip
